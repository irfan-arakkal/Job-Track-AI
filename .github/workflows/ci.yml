name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the integration tests, like docker-compose.yml locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack?schema=public
      TEST_DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_test?schema=public
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack
          POSTGRES_DB: jobtrack_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_e2e?schema=public
      E2E_DATABASE_URL: postgresql://jobtrack:jobtrack@localhost:5432/jobtrack_e2e?schema=public
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
